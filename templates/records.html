<!DOCTYPE html>
<html>
<head>
    <title>Records</title>
</head>
<body>

<h2>Saved Records</h2>

<table border="1">
<tr>
    <th>ID</th>
    <th>Username</th>
    <th>Measured</th>
    <th>Real Size (mm)</th>
    <th>Action</th>
</tr>

{% for r in records %}
<tr>
    <td>{{r[0]}}</td>
    <td>{{r[1]}}</td>
    <td>{{r[2]}}</td>
    <td>{{r[3]}}</td>
    <td><a href="/delete/{{r[0]}}">Delete</a></td>
</tr>
{% endfor %}
</table>

<br>
<a href="/">Back</a>

</body>
</html>
